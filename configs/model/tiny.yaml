# Dense reference backbone. Measure training time on the target hardware.
vocab_size: 8192
d_model: 256
n_layers: 6
n_heads: 8
n_kv_heads: 4          # GQA: n_heads must be divisible by n_kv_heads
max_seq_len: 512
dropout: 0.0
moe: null               # start dense; switch to configs/model/tiny-moe.yaml in Phase 2
