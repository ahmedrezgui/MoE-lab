[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moelab"
version = "0.1.0"
description = "Train, ship, and operate a small MoE language model from scratch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# torch is kept out of core deps so light tooling (lint, config tests) stays fast.
# Install it explicitly, or via one of the extras below.
train = [
    "torch>=2.4",
]
tracking = [
    "mlflow>=2.14",
    "dvc>=3.50",
    "datasets>=2.20",
    "tokenizers>=0.19",
]
serve = [
    "torch>=2.4",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "prometheus-client>=0.20",
]
dev = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/moelab"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
