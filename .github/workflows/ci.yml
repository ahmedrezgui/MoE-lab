name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,serve]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python scripts/prepare_data.py --input examples/demo.txt --output data/demo
      - run: python scripts/train.py --config configs/training/demo.yaml --model configs/model/demo-moe.yaml --max-steps 5
      - run: python scripts/generate.py --prompt "Once upon a time" --max-new-tokens 8
